[package]
name = "wgmesh-cli"
description = "The wgmesh binary: the composition root that wires every adapter to the use cases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false

[lints]
workspace = true

[[bin]]
name = "wgmesh"
path = "src/main.rs"

[dependencies]
wgmesh-core = { path = "../wgmesh-core" }
wgmesh-ports = { path = "../wgmesh-ports" }
wgmesh-app = { path = "../wgmesh-app" }
wgmesh-config = { path = "../wgmesh-config" }
wgmesh-state = { path = "../wgmesh-state" }
wgmesh-secrets = { path = "../wgmesh-secrets" }

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
