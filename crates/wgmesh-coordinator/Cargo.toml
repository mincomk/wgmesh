[package]
name = "wgmesh-coordinator"
description = "Coordinator application: enrollment, configuration, relay assignment, observation. Ships the wgmeshd binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false

[lints]
workspace = true

[[bin]]
name = "wgmeshd"
path = "src/main.rs"

[dependencies]
wgmesh-core = { path = "../wgmesh-core" }
wgmesh-app = { path = "../wgmesh-app" }
wgmesh-proto = { path = "../wgmesh-proto" }
wgmesh-config = { path = "../wgmesh-config" }
wgmesh-state = { path = "../wgmesh-state" }
wgmesh-secrets = { path = "../wgmesh-secrets" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
] }

[dev-dependencies]
base64ct = "1"
tower = { version = "0.5", features = ["util"] }
