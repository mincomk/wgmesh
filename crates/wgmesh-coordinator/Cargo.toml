[package]
name = "wgmesh-coordinator"
description = "Coordinator application: enrollment, configuration, relay assignment, observation. Ships the wgmeshd binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false

[lints]
workspace = true

[[bin]]
name = "wgmeshd"
path = "src/main.rs"

[dependencies]
wgmesh-core = { path = "../wgmesh-core" }
wgmesh-app = { path = "../wgmesh-app" }
wgmesh-proto = { path = "../wgmesh-proto" }
wgmesh-config = { path = "../wgmesh-config" }
wgmesh-state = { path = "../wgmesh-state" }
wgmesh-secrets = { path = "../wgmesh-secrets" }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
base64 = "0.22"
# The failover test drives real relays over loopback UDP: the coordinator's decision is
# only worth anything if the pair it re-homes actually crosses the relay it named.
wgmesh-relay = { path = "../wgmesh-relay" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# The revocation acceptance test carries the coordinator's answer onto an interface, so it
# needs the in-memory WireGuard the ports crate already ships.
wgmesh-ports = { path = "../wgmesh-ports" }
