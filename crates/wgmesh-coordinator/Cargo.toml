[package]
name = "wgmesh-coordinator"
description = "Coordinator application: enrollment, configuration, relay assignment, observation. Ships the wgmeshd binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false

[lints]
workspace = true

[[bin]]
name = "wgmeshd"
path = "src/main.rs"

[dependencies]
wgmesh-core = { path = "../wgmesh-core" }
wgmesh-app = { path = "../wgmesh-app" }
wgmesh-proto = { path = "../wgmesh-proto" }
wgmesh-config = { path = "../wgmesh-config" }
wgmesh-state = { path = "../wgmesh-state" }
wgmesh-secrets = { path = "../wgmesh-secrets" }
wgmesh-metrics = { path = "../wgmesh-metrics" }
axum = "0.8"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
