[package]
name = "wgmesh-relay"
description = "Relay forwarding engine, UDP driver. Ships the wgmesh-relayd binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobins = false

[lints]
workspace = true

[[bin]]
name = "wgmesh-relayd"
path = "src/main.rs"

[dependencies]
wgmesh-core = { path = "../wgmesh-core" }
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
