[package]
name = "wgmesh-secrets"
description = "Secret store: key files, 0600, raw bytes or base64."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wgmesh-core = { path = "../wgmesh-core" }
base64ct = { version = "1", features = ["alloc"] }
ed25519-dalek = "3"
getrandom = "0.4"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"