[package]
name = "xtask"
description = "The workspace's own repository checks: dependency rules and style rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# This crate is tooling, not a product crate: it prints, and it exits. It keeps the
# workspace's unsafe ban but not the parts of the lint set that only make sense for
# code that ships.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"

[dependencies]
serde_json = "1"
